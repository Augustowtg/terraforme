[package]
name = "terraforme-pet"
description = "Janela flutuante com o mascote do terraforme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "terraforme-pet"
path = "src/main.rs"

[dependencies]
terraforme-core.workspace = true

# Só o Linux tem a janela por enquanto (o Windows está no ROADMAP.md).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json.workspace = true
