[package]
name = "terraforme"
version = "0.4.17"
edition = "2024"

[[bin]]
name = "terra"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
catppuccin = { version = "2.8.0", features = ["ratatui"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
dunce = "1.0.5"
ignore = "0.4.33"
jiff = "0.2.38"
notify = "8.2.1"
portable-pty = "0.9"
ratatui = "0.30.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
